<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias por participar</title>
<style>
    body{
        margin:0;
        padding:0;
        background:#f4f7fb;
        font-family:Arial, Helvetica, sans-serif;
    }

    .container{
        width:100%;
        padding:40px 20px;
        box-sizing:border-box;
    }

    .card{
        max-width:600px;
        margin:0 auto;
        background:#ffffff;
        border-radius:16px;
        overflow:hidden;
        box-shadow:0 8px 25px rgba(0,0,0,.08);
        text-align:center;
    }

    .header{
        background:linear-gradient(135deg,#4f46e5,#3b82f6);
        color:#fff;
        padding:40px 20px;
    }

    .header h1{
        margin:0;
        font-size:34px;
    }

    .content{
        padding:40px 30px;
    }

    .content p{
        font-size:18px;
        color:#555;
        line-height:1.7;
        margin:0 0 20px;
    }

    .emoji{
        font-size:60px;
        margin-bottom:20px;
    }

    .button{
        display:inline-block;
        margin-top:20px;
        padding:14px 28px;
        background:#4f46e5;
        color:#fff;
        text-decoration:none;
        border-radius:8px;
        font-weight:bold;
    }

    .footer{
        padding:20px;
        font-size:13px;
        color:#999;
        background:#fafafa;
    }
</style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="header">
            <h1>¡Gracias por participar!</h1>
        </div>

        <div class="content">
            <div class="emoji">🎉</div>

            <p>
                Agradecemos el tiempo que dedicaste para formar parte de esta actividad.
            </p>

        </div>

        <div class="footer">
            © 2026 · Muchas gracias por tu participación.
        </div>

    </div>
</div>

</body>
</html>
