<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Polla Mundialera Pro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --green-deep:#1a4a2e;--green-mid:#256339;--green-bright:#2e7d46;
      --gold:#f4c430;--gold-light:#fdf3c0;--cream:#f5f0e8;--cream-dark:#ede7d9;
      --slate:#2d2d2d;--slate-mid:#4a4a4a;--slate-light:#7a7a7a;--white:#fafaf7;
      --red:#d94f4f;--red-light:#fdeaea;--blue-info:#3b73c8;--border:#ddd8ce;
      --shadow-sm:0 2px 6px rgba(0,0,0,.07);--shadow-md:0 8px 24px rgba(0,0,0,.1);
      --shadow-lg:0 20px 48px rgba(0,0,0,.14);
      --radius-sm:8px;--radius-md:14px;--radius-lg:22px;
      --font-display:'Space Grotesk',system-ui,sans-serif;
      --font-body:'Inter',system-ui,sans-serif;
      --font-mono:'Space Mono',monospace;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background-color:var(--green-deep);background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(46,125,70,.5),transparent),repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.025) 40px,rgba(255,255,255,.025) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.025) 40px,rgba(255,255,255,.025) 41px);font-family:var(--font-body);min-height:100vh;padding:1.5rem;color:var(--slate)}
    .shell{max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:var(--white);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.06)}
    .header{background:var(--green-deep);padding:1.4rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:relative;overflow:hidden}
    .header::after{content:"⚽";position:absolute;right:1.5rem;top:50%;transform:translateY(-50%) rotate(15deg);font-size:5rem;opacity:.07;pointer-events:none}
    .header-left{display:flex;align-items:center;gap:.8rem}
    .header-icon{width:42px;height:42px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .header-icon svg{width:22px;height:22px;fill:var(--green-deep)}
    .header h1{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:-.02em}
    .header p{font-size:.78rem;color:rgba(255,255,255,.55);margin-top:.15rem}
    .auth-bar{background:var(--cream);border-bottom:1px solid var(--border);padding:.75rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem}
    .auth-forms{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
    input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="datetime-local"],textarea,select{font-family:var(--font-body);font-size:.875rem;padding:.6rem .9rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--slate);transition:border-color .18s,box-shadow .18s;width:100%}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(46,125,70,.15)}
    input.auth-input{width:auto;min-width:160px}
    .btn{font-family:var(--font-display);font-size:.85rem;font-weight:600;padding:.55rem 1.1rem;border:none;border-radius:100px;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
    .btn-primary{background:var(--green-deep);color:#fff}
    .btn-primary:hover{background:var(--green-mid);transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,74,46,.3)}
    .btn-secondary{background:#fff;color:var(--slate);border:1.5px solid var(--border)}
    .btn-secondary:hover{background:var(--cream);border-color:#bbb}
    .btn-gold{background:var(--gold);color:var(--green-deep)}
    .btn-gold:hover{background:#e6b820;transform:translateY(-1px);box-shadow:0 4px 12px rgba(244,196,48,.35)}
    .btn-danger{background:var(--red);color:#fff}
    .btn-danger:hover{background:#c43d3d}
    .btn-sm{padding:.35rem .75rem;font-size:.78rem}
    .btn-link{background:transparent;border:none;color:var(--blue-info);font-family:var(--font-body);font-size:.8rem;cursor:pointer;text-decoration:underline;padding:.25rem .5rem}
    .btn-link:hover{color:#1d4ed8}
    .user-pill{display:flex;align-items:center;gap:.7rem;background:var(--green-deep);padding:.3rem .9rem .3rem .3rem;border-radius:100px}
    .avatar{width:32px;height:32px;background:var(--gold);color:var(--green-deep);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:.85rem;text-transform:uppercase;flex-shrink:0}
    .user-pill span{font-family:var(--font-display);font-size:.85rem;font-weight:600;color:#fff}
    .main{padding:1.75rem 2rem}
    .section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap}
    .section-heading h2{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:.5rem}
    .section-heading h2 i{color:var(--green-bright)}
    .groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1.25rem}
    .group-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:1.1rem 1.2rem;transition:all .2s;position:relative;overflow:hidden}
    .group-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green-bright);border-radius:4px 0 0 4px}
    .group-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--green-bright)}
    .group-card h3{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--slate);margin-bottom:.5rem;padding-left:.5rem}
    .group-card p{font-size:.82rem;color:var(--slate-mid);padding-left:.5rem;margin-bottom:.3rem;display:flex;align-items:center;gap:.4rem}
    .group-card p i{color:var(--green-bright);width:14px}
    .id-chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--cream);border:1px solid var(--border);border-radius:100px;padding:.25rem .65rem;font-family:var(--font-mono);font-size:.72rem;color:var(--slate-mid);cursor:pointer;transition:all .15s;margin:.4rem 0 .5rem .5rem}
    .id-chip:hover{background:var(--cream-dark);color:var(--slate)}
    .id-chip i{font-size:.65rem}
    .join-box{background:var(--cream);border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:1rem 1.2rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    .join-box input{flex:1;min-width:180px}
    .tabs-wrapper{background:var(--cream);border-bottom:1px solid var(--border);padding:0 1.5rem}
    .tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tab{font-family:var(--font-display);font-size:.82rem;font-weight:600;padding:.85rem 1rem;cursor:pointer;color:var(--slate-light);border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .18s;display:flex;align-items:center;gap:.4rem}
    .tab:hover{color:var(--green-bright)}
    .tab.active{color:var(--green-deep);border-bottom-color:var(--green-deep)}
    .tab i{font-size:.8rem}
    .group-view-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:var(--cream);border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap}
    .group-view-header h2{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--slate)}
    .match-ticket{background:#fff;border-radius:var(--radius-md);border:1.5px solid var(--border);overflow:hidden;transition:box-shadow .2s;margin-bottom:.9rem}
    .match-ticket:hover{box-shadow:var(--shadow-sm)}
    .ticket-header{background:var(--green-deep);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between}
    .ticket-header span{font-family:var(--font-mono);font-size:.72rem;color:rgba(255,255,255,.7)}
    .ticket-header .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:.4rem}
    .status-open .status-dot{background:#4ade80;box-shadow:0 0 6px #4ade80}
    .status-locked .status-dot{background:var(--gold)}
    .status-finished .status-dot{background:#94a3b8}
    .status-live .status-dot{background:#f87171;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .ticket-body{padding:.9rem 1.2rem}
    .teams-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem}
    .team-name{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--slate);flex:1}
    .team-name.away{text-align:right}
    .vs-badge{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:.2rem .6rem;font-family:var(--font-display);font-size:.72rem;font-weight:700;color:var(--slate-light);letter-spacing:.05em;flex-shrink:0}
    .live-score{background:var(--slate);border-radius:8px;padding:.3rem .8rem;font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--gold);letter-spacing:.05em;flex-shrink:0}
    .score-input-row{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:.6rem 0}
    .score-digit-input{width:56px!important;height:56px;font-family:var(--font-display)!important;font-size:1.5rem!important;font-weight:700!important;text-align:center;border:2px solid var(--border)!important;border-radius:var(--radius-sm)!important;background:var(--slate)!important;color:var(--gold)!important;padding:0!important;transition:border-color .18s,box-shadow .18s!important}
    .score-digit-input:focus{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(244,196,48,.2),inset 0 0 8px rgba(244,196,48,.1)!important}
    .score-dash{font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--slate-light)}
    .pred-badge{display:inline-flex;align-items:center;gap:.4rem;background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:100px;padding:.3rem .8rem;font-family:var(--font-display);font-size:.8rem;font-weight:600;color:#065f46;margin-top:.4rem}
    .pred-badge i{color:#10b981}
    .result-badge{display:inline-flex;align-items:center;gap:.4rem;background:#f1f5f9;border:1.5px solid #cbd5e1;border-radius:100px;padding:.3rem .8rem;font-family:var(--font-display);font-size:.8rem;font-weight:600;color:var(--slate);margin-top:.4rem}
    .points-badge{display:inline-flex;align-items:center;gap:.35rem;background:var(--gold-light);border:1.5px solid var(--gold);border-radius:100px;padding:.3rem .8rem;font-family:var(--font-display);font-size:.8rem;font-weight:700;color:#78350f;margin-top:.4rem}
    .joker-badge{display:inline-flex;align-items:center;gap:.35rem;background:#ede9fe;border:1.5px solid #a78bfa;border-radius:100px;padding:.3rem .8rem;font-family:var(--font-display);font-size:.8rem;font-weight:700;color:#5b21b6;margin-top:.4rem}
    .locked-banner{display:flex;align-items:center;gap:.4rem;background:#fef9c3;border-radius:100px;padding:.25rem .75rem;font-size:.78rem;font-weight:600;color:#854d0e;margin-top:.4rem}
    .no-pred-banner{display:flex;align-items:center;gap:.4rem;background:var(--red-light);border-radius:100px;padding:.25rem .75rem;font-size:.78rem;font-weight:600;color:#7f1d1d;margin-top:.4rem}
    .live-banner{display:flex;align-items:center;gap:.4rem;background:#fef2f2;border-radius:100px;padding:.25rem .75rem;font-size:.78rem;font-weight:600;color:#991b1b;margin-top:.4rem}
    .ticket-footer{display:flex;align-items:center;justify-content:flex-end;padding:.6rem 1.2rem;border-top:1.5px dashed var(--border);gap:.5rem;flex-wrap:wrap}
    .empty-state{text-align:center;padding:3rem 2rem;color:var(--slate-light)}
    .empty-state i{font-size:2.5rem;margin-bottom:.75rem;display:block;color:var(--border)}
    .empty-state p{font-size:.9rem}
    .ranking-wrap{overflow:hidden;border-radius:var(--radius-md);border:1.5px solid var(--border)}
    .ranking-table{width:100%;border-collapse:collapse}
    .ranking-table thead tr{background:var(--green-deep)}
    .ranking-table th{padding:.7rem 1rem;font-family:var(--font-display);font-size:.78rem;font-weight:600;color:rgba(255,255,255,.75);text-align:left;letter-spacing:.04em;text-transform:uppercase}
    .ranking-table td{padding:.7rem 1rem;border-bottom:1px solid var(--cream-dark);font-size:.875rem;color:var(--slate)}
    .ranking-table tbody tr:last-child td{border-bottom:none}
    .ranking-table tbody tr:hover td{background:var(--cream)}
    .rank-pos{font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--slate-light)}
    .rank-pos.gold{color:#d97706}
    .rank-pos.silver{color:#6b7280}
    .rank-pos.bronze{color:#92400e}
    .pts-cell{font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--green-deep)}
    .crown-icon{color:var(--gold);font-size:.85rem;margin-left:.3rem}
    .prize-card{background:linear-gradient(135deg,var(--green-deep) 0%,var(--green-mid) 100%);border-radius:var(--radius-md);padding:1.2rem 1.4rem;margin-top:1rem;color:#fff;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem}
    .prize-item{background:rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:.7rem .9rem;border:1px solid rgba(255,255,255,.1)}
    .prize-item .pos{font-size:.72rem;color:rgba(255,255,255,.5);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2rem}
    .prize-item .amount{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--gold)}
    .prize-item .pct{font-size:.72rem;color:rgba(255,255,255,.45)}
    .prize-total{grid-column:1/-1;text-align:center;padding-top:.5rem;border-top:1px solid rgba(255,255,255,.15);font-size:.85rem;color:rgba(255,255,255,.7)}
    .prize-total strong{color:var(--gold);font-family:var(--font-display);font-size:1rem}
    .chat-container{height:380px;overflow-y:auto;background:var(--cream);border-radius:var(--radius-md);padding:1rem;margin-bottom:.75rem;display:flex;flex-direction:column;gap:.6rem;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
    .message{background:#fff;border-radius:var(--radius-sm);padding:.6rem .85rem;box-shadow:var(--shadow-sm);border-left:3px solid var(--green-bright);font-size:.875rem}
    .message.own{border-left-color:var(--gold)}
    .message strong{font-family:var(--font-display);font-size:.82rem;color:var(--green-deep)}
    .message small{color:var(--slate-light);font-size:.72rem;margin-left:.4rem}
    .chat-input-row{display:flex;gap:.6rem;align-items:center}
    .chat-input-row input{flex:1}
    .history-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:.9rem 1.1rem;margin-bottom:.75rem;display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:start}
    .history-card .match-title{font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--slate);grid-column:1/-1;margin-bottom:.2rem}
    .admin-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:1.1rem 1.2rem;margin-bottom:.9rem}
    .admin-card h3{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--slate);margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
    .admin-card h3 i{color:var(--green-bright)}
    .form-grid{display:flex;flex-direction:column;gap:.6rem}
    .result-row{display:flex;align-items:center;gap:.5rem}
    .result-row .score-digit-input{width:48px!important;height:48px;font-size:1.2rem!important}
    .settings-section{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:1.1rem 1.2rem;margin-bottom:.9rem}
    .settings-section h3{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--slate);margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
    .settings-section h3 i{color:var(--green-bright)}
    .config-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--cream-dark);font-size:.875rem}
    .config-row:last-child{border-bottom:none}
    .config-row label{color:var(--slate-mid)}
    .config-row strong{color:var(--slate);font-weight:600}
    .edit-grid{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;align-items:center;margin-top:.5rem}
    .edit-grid label{font-size:.85rem;color:var(--slate-mid);align-self:center}
    .edit-grid input{width:90px}
    .fund-table{width:100%;border-collapse:collapse;font-size:.82rem}
    .fund-table th{background:var(--cream);padding:.5rem .75rem;text-align:left;font-family:var(--font-display);font-size:.72rem;font-weight:600;color:var(--slate-mid);text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--border)}
    .fund-table td{padding:.5rem .75rem;border-bottom:1px solid var(--cream-dark);color:var(--slate)}
    .fund-total-row{background:var(--green-deep);border-radius:var(--radius-sm);padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;color:#fff}
    .fund-total-row span{font-size:.85rem;color:rgba(255,255,255,.65)}
    .fund-total-row strong{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:var(--gold)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);justify-content:center;align-items:center;z-index:9999}
    .modal-content{background:#fff;border-radius:var(--radius-lg);max-width:420px;width:90%;padding:1.75rem;box-shadow:var(--shadow-lg);animation:popIn .2s cubic-bezier(.34,1.56,.64,1)}
    .modal-content h3{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--slate);margin-bottom:.6rem}
    .modal-content p{font-size:.875rem;color:var(--slate-mid);margin-bottom:.75rem}
    .modal-buttons{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.4rem}
    @keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .hidden{display:none!important}
    .mt-1{margin-top:.4rem}.mt-2{margin-top:.85rem}
    .divider{height:1px;background:var(--border);margin:1rem 0}
    .all-predictions-table{width:100%;border-collapse:collapse;margin-top:.4rem;font-size:.85rem}
    .all-predictions-table th{text-align:left;padding:.4rem .5rem;background:var(--cream-dark);font-family:var(--font-display);font-size:.72rem;font-weight:600;color:var(--slate-mid);text-transform:uppercase;letter-spacing:.04em}
    .all-predictions-table td{padding:.35rem .5rem;border-bottom:1px solid var(--cream-dark);color:var(--slate)}
    /* PERFIL */
    .profile-hero{background:linear-gradient(135deg,var(--green-deep),var(--green-mid));border-radius:var(--radius-md);padding:1.5rem;color:#fff;display:flex;align-items:center;gap:1.2rem;margin-bottom:1rem}
    .profile-avatar{width:60px;height:60px;background:var(--gold);color:var(--green-deep);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:1.5rem;flex-shrink:0}
    .profile-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem;margin-bottom:1rem}
    .stat-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.9rem 1rem;text-align:center}
    .stat-card .stat-value{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--green-deep)}
    .stat-card .stat-label{font-size:.75rem;color:var(--slate-light);margin-top:.2rem}
    /* JOKER */
    .joker-card{background:linear-gradient(135deg,#4c1d95,#7c3aed);border-radius:var(--radius-md);padding:1.2rem 1.4rem;color:#fff;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    .joker-info h4{font-family:var(--font-display);font-size:1rem;font-weight:700;margin-bottom:.3rem}
    .joker-info p{font-size:.82rem;opacity:.8}
    .joker-used{opacity:.5}
    /* ORGANIGRAMA / BRACKET */
    .bracket-container{overflow-x:auto;padding:.5rem 0}
    .bracket-phase{margin-bottom:1.2rem}
    .bracket-phase h3{font-family:var(--font-display);font-size:.9rem;font-weight:700;color:var(--green-deep);padding:.5rem .75rem;background:var(--cream);border-radius:var(--radius-sm);margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}
    .bracket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}

  // Convierte ISO UTC a hora Bolivia (UTC-4) para mostrar
  // La API da matchDateTimeUTC en UTC real. Bolivia = UTC-4.
  // Adicionalmente mostramos el campo UTC crudo en el admin para debug.
  function toBoliviaDisplay(isoUTC) {
  if (!isoUTC) return '';
  // Si ya tiene información de zona horaria (Z o ±HH:MM), se usa directamente.
  // Si no tiene ninguna, se asume UTC agregando 'Z'.
  let utcString = isoUTC;
  const hasZone = /[Zz]$/.test(isoUTC) || /[+-]\d{2}:\d{2}$/.test(isoUTC);
  if (!hasZone) {
    utcString = isoUTC + 'Z';
  }
  const d = new Date(utcString);
  if (isNaN(d.getTime())) return '';
  const bolivia = new Date(d.toLocaleString('en-US', { timeZone: 'America/La_Paz' }));
  if (isNaN(bolivia.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${bolivia.getFullYear()}-${pad(bolivia.getMonth()+1)}-${pad(bolivia.getDate())}T${pad(bolivia.getHours())}:${pad(bolivia.getMinutes())}:00`;
}

  // Traduce nombres de grupos/fases del alemán al español
  function translateGroup(g) {
    if (!g) return '';
    return g
      .replace(/Gruppenphase/gi,  'Fase de grupos')
      .replace(/Gruppe/gi,        'Grupo')
      .replace(/Achtelfinale/gi,  'Octavos de final')
      .replace(/Viertelfinale/gi, 'Cuartos de final')
      .replace(/Halbfinale/gi,    'Semifinal')
      .replace(/Finale/gi,        'Final')
      .replace(/Spiel um Platz 3/gi, 'Tercer puesto')
      .replace(/Playoff/gi,       'Playoff')
      .replace(/Round of 16/gi,   'Octavos de final')
      .replace(/Quarter-final/gi, 'Cuartos de final')
      .replace(/Semi-final/gi,    'Semifinal')
      .replace(/Third place/gi,   'Tercer puesto')
      .replace(/Group Stage/gi,   'Fase de grupos')
      .replace(/Group /gi,        'Grupo ')
      .replace(/Round /gi,        'Ronda ')
      .replace(/Sechzehntelfinal/gi, 'Dieciseisavos de final');
  }

  // Convierte un partido de OpenLigaDB al formato interno
  function apiMatchToInternal(m) {
    // Después (prórroga si existe, si no 90 min)
    const finalResult = m.matchResults?.find(r => r.resultTypeID === 4) || m.matchResults?.find(r => r.resultTypeID === 2);
    const isLive = !m.matchIsFinished && new Date() > new Date(m.matchDateTimeUTC);
    const localDT = toBoliviaDisplay(m.matchDateTimeUTC);
    return {
      id: String(m.matchID),
      home_team: translateTeam(m.team1.teamName),
      away_team: translateTeam(m.team2.teamName),
      home_icon: m.team1.teamIconUrl,
      away_icon: m.team2.teamIconUrl,
      match_datetime:     localDT,          // hora Bolivia (UTC-4), para mostrar
      match_datetime_utc: m.matchDateTimeUTC, // hora UTC real, para lógica de bloqueo/hoy
      status: m.matchIsFinished ? 'finished' : (isLive ? 'live' : 'scheduled'),
      result: finalResult ? { home: finalResult.pointsTeam1, away: finalResult.pointsTeam2 } : null,
      group: translateGroup(m.group?.groupName || ''),
      stadium: m.location?.locationStadium || '',
      city: m.location?.locationCity || ''
    };
  }

  function startGlobalSync() {

    livePollingInterval = setInterval(async () => {

      allApiMatches = data.map(apiMatchToInternal);

  function isTodayUTC(utcIso) {
    const d = new Date(utcIso);
    const local = new Date(d.toLocaleString('en-US',{timeZone:'America/La_Paz'}));
    local.setHours(0,0,0,0);
    return local.getTime() === toBoliviaDate(new Date()).getTime();
  }

  // AUTO UPDATE: actualiza resultados de partidos en vivo y recalcula puntos
  async function autoUpdateLiveScores() {
    if (!currentGroup) return;
    const liveOrFinished = allApiMatches.filter(m =>
      (m.status === 'live' || m.status === 'finished') && m.result !== null
    );
    for (const match of liveOrFinished) {
      // Verificar si el resultado cambió respecto a lo guardado en BD
      const { data: existing } = await supabase.from('matches').select('result,status').eq('id', match.id).maybeSingle();
      if (!existing) {
        // Crear el partido en BD
        try {
          await supabase.from('matches').upsert({
            id: match.id, home_team: match.home_team, away_team: match.away_team,
            match_datetime: match.match_datetime_utc, result: match.result,
            status: match.status, group_name: match.group
          }, { onConflict: 'id' });
        } catch (_) {}
        if (match.status === 'finished') await calcPoints(match.id, match.result, currentGroup.id);
      } else {
        const changed = !existing.result ||
          existing.result.home !== match.result.home ||
          existing.result.away !== match.result.away;
        if (changed || (match.status==='finished' && existing.status!=='finished')) {
          await supabase.from('matches').update({
            result: match.result, status: match.status
          }).eq('id', match.id);
          await calcPoints(match.id, match.result, currentGroup.id);
        }
      }
    }
  }

  async function calcPoints(matchId, result, groupId) {
    const { data: preds } = await supabase.from('predictions').select('id,predicted_home,predicted_away,joker_used')
      .eq('match_id', matchId).eq('group_id', groupId);
    if (!preds?.length) return;
    const cfg = currentGroup.config;
    const signoReal = result.home>result.away ? 1 : result.home<result.away ? -1 : 0;
    for (const pred of preds) {
      const pH = pred.predicted_home, pA = pred.predicted_away;
      let pts = 0;
      if (pH===result.home && pA===result.away) pts = cfg.puntos_marcador_exacto||5;
      else {
        const sg = pH>pA?1:pH<pA?-1:0;
        if (sg===signoReal) pts = signoReal===0 ? (cfg.puntos_empate||1) : (cfg.puntos_ganador||3);
      }
      if (pred.joker_used) pts *= 2;
      await supabase.from('predictions').update({ points_earned: pts }).eq('id', pred.id);
    }
  }

  async function syncMatchesToDB(matches) {
    if (!matches?.length) return;
    // Upsert en lote — mucho más rápido que N queries individuales
    const rows = matches.map(m => ({
      id:             m.id,
      home_team:      m.home_team,
      away_team:      m.away_team,
      match_datetime: m.match_datetime_utc,
      result:         m.result,
      status:         m.status,
      group_name:     m.group
    }));
    const SIZE = 50;
    for (let i = 0; i < rows.length; i += SIZE) {
      try {
        await supabase.from('matches').upsert(rows.slice(i, i + SIZE), { onConflict: 'id' });
      } catch (_) {}
    }
  }

    showModal("¡Bienvenido!", "Te uniste al grupo \"" + group.name + "\" exitosamente.");

  // ===== PREDICTIONS =====
  function getMatchStatus(match) {
    const minLimite = currentGroup?.config?.minutos_limite_antes || 30;
    if (match.status === 'finished') return 'finished';
    if (match.status === 'live') return 'live';
    if (isLocked(match.match_datetime_utc, minLimite)) return 'locked';
    return 'open';
  }

  function renderPredictionsTab() {
    const container = document.getElementById("tabPredictions");
    if (!matchesList.length) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No hay partidos del Mundial programados para hoy.</p></div>`;
      return;
    }
    const jokerAvail = !userJokerMatchId;

    container.innerHTML = `
      <div style="margin-bottom:.75rem">
        <div class="joker-card ${jokerAvail ? '' : 'joker-used'}">
          <div class="joker-info">
            <h4>🃏 Comodín Mundial</h4>
            <p>${jokerAvail ? 'Disponible — úsalo en UN partido para duplicar tus puntos' : 'Ya usaste tu comodín en este mundial'}</p>
          </div>
          <div style="font-size:1.8rem">${jokerAvail ? '✨' : '✅'}</div>
        </div>
      </div>
      ${matchesList.map(match => renderTicket(match, jokerAvail)).join('')}
    `;

      btn.onclick = () => savePrediction(btn.getAttribute('data-match'));
    });
    document.querySelectorAll('.useJokerBtn').forEach(btn=>{
      btn.onclick = () => useJoker(btn.getAttribute('data-match'));

    return `
      <div class="match-ticket">
        <div class="ticket-header status-${status}">
          <span><span class="status-dot"></span>${statusLabels[status]||status}</span>
          <span style="display:flex;align-items:center;gap:.4rem">
            <span class="api-badge"><i class="fas fa-satellite-dish"></i> openligadb</span>

        </div>
        <div class="ticket-body">
          <div style="font-size:.72rem;color:var(--slate-light);margin-bottom:.4rem"><i class="fas fa-map-marker-alt" style="color:var(--green-bright)"></i> ${esc(match.city||'')} ${match.stadium?'· '+esc(match.stadium):''} <span style="background:var(--cream);border-radius:4px;padding:.1rem .4rem;margin-left:.3rem">${esc(match.group||'')}</span></div>
          <div class="teams-row">
            <span class="team-name">${teamFlag(match.home_icon, match.home_team)}${esc(match.home_team)}</span>
            ${status==='live' && match.result ? `<span class="live-score">${match.result.home} — ${match.result.away}</span>` : `<span class="vs-badge">VS</span>`}
            <span class="team-name away">${esc(match.away_team)}${teamFlag(match.away_icon, match.away_team)}</span>
          </div>
          ${status==='open' && !pred ? `
            <div class="score-input-row">
              <input type="number" id="home_${match.id}" class="score-digit-input" placeholder="0" value="${homeVal}" min="0" max="99">
              <span class="score-dash">—</span>
              <input type="number" id="away_${match.id}" class="score-digit-input" placeholder="0" value="${awayVal}" min="0" max="99">

          <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem">

            ${isMyJoker ? `<div class="joker-badge">🃏 Comodín aplicado (x2)</div>` : ''}
            ${match.result && status!=='live' ? `<div class="result-badge"><i class="fas fa-futbol"></i> Resultado: ${match.result.home} – ${match.result.away}</div>` : ''}

            ${status==='locked' && !pred ? `<div class="no-pred-banner"><i class="fas fa-times-circle"></i> Sin pronóstico</div>` : ''}
            ${pred?.points_earned!=null ? `<div class="points-badge"><i class="fas fa-star"></i> ${pred.points_earned} pts${isMyJoker ? ' (x2 comodín)' : ''}</div>` : ''}
          </div>
        </div>
        ${status==='open' && !pred ? `
          <div class="ticket-footer">
            ${jokerAvail ? `<button data-match="${match.id}" class="useJokerBtn btn btn-sm" style="background:#7c3aed;color:#fff">🃏 Usar comodín aquí</button>` : ''}
            <button data-match="${match.id}" class="savePredictionBtn btn btn-gold btn-sm"><i class="fas fa-save"></i> Guardar pronóstico</button>
          </div>` : ''}
      </div>`;
  }

  async function savePrediction(matchId, joker=false) {
    const match = matchesList.find(m=>m.id===matchId);
    if (!match) return;
    const minL = currentGroup.config.minutos_limite_antes||30;
    if (isLocked(match.match_datetime_utc, minL)) { showModal("Tiempo agotado","El límite para pronosticar ya expiró.",true); await reloadPredictions(); return; }
    const homeEl = document.getElementById(`home_${matchId}`);
    const awayEl = document.getElementById(`away_${matchId}`);
    if (!homeEl||!awayEl) { showModal("Error","Ingresa el marcador.",true); return; }
    const home = parseInt(homeEl.value);
    const away = parseInt(awayEl.value);
    if (isNaN(home)||isNaN(away)) { showModal("Error","Ingresá números válidos.",true); return; }
    const existing = predictionsMap.get(`${matchId}:${currentGroup.id}`);
    if (existing) {
      await supabase.from('predictions').update({ predicted_home:home, predicted_away:away, joker_used:joker||existing.joker_used }).eq('id', existing.id);
    } else {
      await supabase.from('predictions').insert({ match_id:matchId, user_id:currentUser.id, group_id:currentGroup.id, predicted_home:home, predicted_away:away, joker_used:joker });
    }
    if (joker) userJokerMatchId = matchId;
    showModal("¡Listo!",`Pronóstico guardado${joker?' con comodín 🃏':''}!`);
    await reloadPredictions();
  }

  async function useJoker(matchId) {
    if (userJokerMatchId) { showModal("Comodín ya usado","Solo puedes usar el comodín una vez en todo el Mundial.",true); return; }
    showModal(
      "🃏 Usar Comodín",
      "El comodín duplica tus puntos en este partido y solo puedes usarlo UNA VEZ en todo el Mundial. ¿Confirmas?",
      false, '', async () => { await savePrediction(matchId, true); }, () => {}
    );
  }

  async function reloadPredictions() {
    const todayIds = matchesList.map(m=>m.id);
    const { data: preds } = await supabase.from('predictions').select('*')
      .eq('group_id', currentGroup.id).eq('user_id', currentUser.id).in('match_id', todayIds.length ? todayIds : ['__none__']);
    predictionsMap.clear();
    (preds||[]).forEach(p => predictionsMap.set(`${p.match_id}:${currentGroup.id}`, p));
    const { data: jokerData } = await supabase.from('predictions')
      .select('match_id').eq('user_id', currentUser.id).eq('group_id', currentGroup.id).eq('joker_used', true).maybeSingle();
    userJokerMatchId = jokerData?.match_id || null;
    renderPredictionsTab();
  }

  async function loadBracket() {

      container.innerHTML=`<div class="empty-state"><i class="fas fa-sitemap"></i><p>Cargando organigrama…</p></div>`;

    container.innerHTML = Object.entries(phases).map(([phase, matches])=>`
      <div class="bracket-phase">
        <h3><i class="fas fa-layer-group"></i> ${esc(phase)}</h3>
        <div class="bracket-grid">
          ${matches.map(m=>{

            const awayWin = r && r.away > r.home;
            return `
              <div class="bracket-match">
                <div class="bm-header">${fmtDT(m.match_datetime)} · ${esc(m.city||'')}</div>
                <div class="bm-team ${homeWin?'winner':''}">

              </div>`;
          }).join('')}
        </div>
      </div>`).join('');
  }

  // ===== CHAT =====
  async function setupChat() {
    if (chatSubscription) await chatSubscription.unsubscribe();
    await loadChatMessages();
    chatSubscription = supabase.channel(`chat_${currentGroup.id}`)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`group_id=eq.${currentGroup.id}`}, async payload=>{
        const { data: profile } = await supabase.from('profiles').select('username').eq('id', payload.new.user_id).single();
        appendMessage({...payload.new, username: profile?.username});
      }).subscribe();
  }
  async function loadChatMessages() {
    const { data } = await supabase.from('chat_messages').select('*,user_id').eq('group_id', currentGroup.id).order('created_at',{ascending:true}).limit(80);
    if (!data) return;
    const uids = [...new Set(data.map(m=>m.user_id))];
    const { data: profiles } = await supabase.from('profiles').select('id,username').in('id', uids);
    const uMap = new Map(profiles?.map(p=>[p.id,p.username])||[]);
    const chatDiv = document.getElementById("chatMessages");
    chatDiv.innerHTML='';
    data.forEach(msg=>appendMessage({...msg, username: uMap.get(msg.user_id)||msg.user_id}));
  }
  function appendMessage(msg) {
    const chatDiv = document.getElementById("chatMessages");
    const div = document.createElement('div');
    div.className = 'message'+(msg.user_id===currentUser?.id?' own':'');
    const crown = currentGroup?.created_by===msg.user_id?'<i class="fas fa-crown" style="color:var(--gold);font-size:.75rem"></i>':'';
    div.innerHTML=`<strong>${esc(msg.username)} ${crown}</strong><small>${new Date(msg.created_at).toLocaleTimeString('es-BO',{timeZone:'America/La_Paz'})}</small><br>${esc(msg.message)}`;
    chatDiv.appendChild(div);
    chatDiv.scrollTop=chatDiv.scrollHeight;
  }
  document.getElementById("sendChatBtn").onclick = async () => {
    const input = document.getElementById("chatInput");
    if (!input.value.trim()) return;
    await supabase.from('chat_messages').insert({ group_id:currentGroup.id, user_id:currentUser.id, message:input.value });
    input.value='';
  };
  document.getElementById("chatInput").addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById("sendChatBtn").click(); });

    container.innerHTML = `
      <div class="admin-card">
        <h3><i class="fas fa-satellite-dish"></i> Partidos de hoy — sincronizados con OpenLigaDB</h3>
        <p style="font-size:.8rem;color:var(--slate-light);margin-bottom:.75rem">Los resultados se actualizan automáticamente cada ${currentGroup.config.minutos_poll||15} min. Puedes corregir manualmente si es necesario.</p>
        ${today.length ? today.map(renderMatchAdmin).join('') : '<p style="font-size:.85rem;color:var(--slate-light)">No hay partidos hoy.</p>'}
      </div>
      ${past.length ? `
      <div class="admin-card">
        <h3><i class="fas fa-history"></i> Partidos anteriores</h3>
        ${[...past].sort((a,b)=>new Date(b.match_datetime_utc)-new Date(a.match_datetime_utc)).map(renderMatchAdmin).join('')}
      </div>` : ''}
      ${future.length ? `
      <div class="admin-card">
        <h3><i class="fas fa-calendar-alt"></i> Próximos partidos (${future.length})</h3>
        ${future.slice(0,8).map(m=>`
          <div style="padding:.5rem 0;border-bottom:1px solid var(--cream-dark);font-size:.85rem;display:flex;justify-content:space-between">
            <span>${esc(m.home_team)} vs ${esc(m.away_team)}</span>
            <span style="color:var(--slate-light)">${fmtDT(m.match_datetime)}</span>
          </div>`).join('')}
        ${future.length>8?`<p style="font-size:.8rem;color:var(--slate-light);margin-top:.5rem">…y ${future.length-8} más</p>`:''}
      </div>` : ''}
      <div class="admin-card">
        <h3><i class="fas fa-sync-alt"></i> Sincronización manual</h3>
        <p style="font-size:.82rem;color:var(--slate-light);margin-bottom:.75rem">Fuerza una actualización inmediata de resultados y recálculo de puntos.</p>
        <button id="forceSyncBtn" class="btn btn-primary btn-sm"><i class="fas fa-sync-alt"></i> Sincronizar ahora</button>
      </div>
      <div class="admin-card">
        <h3><i class="fas fa-bug"></i> Debug de horarios (primeros 5 partidos)</h3>
        <p style="font-size:.78rem;color:var(--slate-light);margin-bottom:.5rem">Muestra los valores crudos de la API para verificar la hora correcta.</p>
        <div id="debugHoras" style="font-family:monospace;font-size:.75rem;background:var(--cream);padding:.75rem;border-radius:var(--radius-sm);overflow-x:auto">
          ${allApiMatches.slice(0,5).map(m=>`
            <div style="margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)">
              <strong>${esc(m.home_team)} vs ${esc(m.away_team)}</strong><br>
              UTC (API): ${m.match_datetime_utc}<br>
              Bolivia (-4h): ${m.match_datetime}<br>
              Muestra como: ${fmtDT(m.match_datetime)}
            </div>`).join('')}
        </div>
      </div>`;

    document.getElementById("forceSyncBtn")?.addEventListener('click', async ()=>{
      document.getElementById("forceSyncBtn").innerHTML='<i class="fas fa-spinner fa-spin"></i> Sincronizando…';
      const apiData = await fetchAllMatches(true);
      allApiMatches = apiData.map(apiMatchToInternal);
      await syncMatchesToDB(allApiMatches);
      await autoUpdateLiveScores();
      await loadAdminTab();
      await loadRanking();
      showModal("¡Listo!","Resultados sincronizados y puntos recalculados.");
    });

    document.querySelectorAll('.saveResultBtn').forEach(btn=>{
      btn.onclick = async () => {
        const matchId = btn.getAttribute('data-match');
        const rH = parseInt(document.getElementById(`res_home_${matchId}`)?.value);
        const rA = parseInt(document.getElementById(`res_away_${matchId}`)?.value);
        if (isNaN(rH)||isNaN(rA)) { showModal("Error","Ingresa números válidos.",true); return; }
        await supabase.from('matches').update({ result:{home:rH,away:rA}, status:'finished' }).eq('id', matchId);
        const match = allApiMatches.find(m=>m.id===matchId);
        if (match) { match.result={home:rH,away:rA}; match.status='finished'; }
        await calcPoints(matchId, {home:rH,away:rA}, currentGroup.id);
        showModal("¡Guardado!",`Resultado ${rH}-${rA} guardado y puntos actualizados.`);
        await loadAdminTab(); await loadRanking();
      };
    });
  }

  // ===== SETTINGS =====
  async function loadSettingsTab() {
    const isCreator = currentGroup.created_by===currentUser.id;
    const container = document.getElementById("tabSettings");
    const { data: txns } = await supabase.from('fund_transactions').select('*,profiles(username)').eq('group_id', currentGroup.id).order('created_at',{ascending:false});
    const cfg = currentGroup.config;
    container.innerHTML = `
      <div class="settings-section">
        <h3><i class="fas fa-info-circle"></i> Configuración del grupo</h3>
        <div class="config-row"><label>ID del grupo</label><div class="id-chip" id="copyIdSettings" style="cursor:pointer"><i class="fas fa-fingerprint"></i>${currentGroup.id.slice(0,14)}…<i class="fas fa-copy"></i></div></div>
        <div class="config-row"><label>Pts — Ganador / Empate / Exacto</label><strong>${cfg.puntos_ganador} / ${cfg.puntos_empate} / ${cfg.puntos_marcador_exacto}</strong></div>
        <div class="config-row"><label>Minutos límite antes del partido</label><strong>${cfg.minutos_limite_antes} min</strong></div>
        <div class="config-row"><label>Intervalo de actualización en vivo</label><strong>Cada ${cfg.minutos_poll||15} minutos</strong></div>
        <div class="config-row"><label>Fuente de datos</label><strong><span class="api-badge"><i class="fas fa-satellite-dish"></i> OpenLigaDB WM26</span></strong></div>
        <div class="config-row"><label>% premios (1°/2°/3°/4°)</label><strong>${cfg.porcentajes_premios['1']}%/${cfg.porcentajes_premios['2']}%/${cfg.porcentajes_premios['3']}%/${cfg.porcentajes_premios['4']}%</strong></div>
        ${isCreator ? `
          <div class="divider"></div>
          <h4 style="font-family:var(--font-display);font-size:.875rem;font-weight:700;color:var(--slate);margin-bottom:.75rem"><i class="fas fa-edit" style="color:var(--green-bright)"></i> Editar reglas</h4>
          <div class="edit-grid">
            <label>Puntos por ganador</label><input type="number" id="editPG" value="${cfg.puntos_ganador}">
            <label>Puntos por empate</label><input type="number" id="editPE" value="${cfg.puntos_empate}">
            <label>Puntos marcador exacto</label><input type="number" id="editPX" value="${cfg.puntos_marcador_exacto}">
            <label>Minutos límite</label><input type="number" id="editML" value="${cfg.minutos_limite_antes}">
            <label>Minutos entre actualizaciones en vivo</label><input type="number" id="editMP" value="${cfg.minutos_poll||15}">
            <label>% 1er lugar</label><input type="number" id="ep1" value="${cfg.porcentajes_premios['1']}">
            <label>% 2do lugar</label><input type="number" id="ep2" value="${cfg.porcentajes_premios['2']}">
            <label>% 3er lugar</label><input type="number" id="ep3" value="${cfg.porcentajes_premios['3']}">
            <label>% 4to lugar</label><input type="number" id="ep4" value="${cfg.porcentajes_premios['4']}">
          </div>
          <button id="saveRulesBtn" class="btn btn-primary btn-sm" style="margin-top:.9rem"><i class="fas fa-save"></i> Guardar cambios</button>
        ` : ''}
      </div>
      <div class="fund-total-row">
        <span>Fondo común acumulado</span>
        <strong>Bs. ${(currentGroup.fondo_comun_total||0).toFixed(2)}</strong>
      </div>
      <div class="settings-section">
        <h3><i class="fas fa-coins"></i> Fondo común</h3>
        ${isCreator ? `
          <div style="display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem">
            <input type="text" id="depositorName" placeholder="Nombre del depositante">
            <div style="display:flex;gap:.6rem;align-items:center">
              <input type="number" id="addAmount" placeholder="Monto (Bs.)" step="0.01" style="flex:1">
              <button id="addFundBtn" class="btn btn-gold btn-sm"><i class="fas fa-plus"></i> Agregar</button>
            </div>
          </div>` : '<p style="font-size:.85rem;color:var(--slate-light);margin-bottom:.75rem"><i class="fas fa-lock"></i> Solo el creador puede registrar depósitos.</p>'}
        ${txns?.length ? `
          <div style="overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <table class="fund-table">
              <thead><tr><th>Fecha</th><th>Depositante</th><th>Monto</th><th>Registrado por</th></tr></thead>
              <tbody>${txns.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString('es-BO',{timeZone:'America/La_Paz'})}</td><td>${esc(t.description?.replace('Depósito de: ','')||'Anónimo')}</td><td style="font-weight:600;color:var(--green-deep)">Bs. ${t.amount.toFixed(2)}</td><td>${esc(t.profiles?.username||t.user_id)}</td></tr>`).join('')}</tbody>
            </table>
          </div>` : '<p style="font-size:.85rem;color:var(--slate-light)">Sin depósitos.</p>'}
      </div>
      <div class="settings-section">
        <h3><i class="fas fa-download"></i> Respaldo y transparencia</h3>
        <p style="font-size:.85rem;color:var(--slate-light);margin-bottom:.75rem">Descarga un CSV con todos los pronósticos y puntos del grupo.</p>
        <button id="downloadCsvBtn" class="btn btn-primary btn-sm"><i class="fas fa-file-csv"></i> Descargar CSV</button>
      </div>`;

    document.getElementById("copyIdSettings")?.addEventListener('click',()=>{navigator.clipboard.writeText(currentGroup.id); showModal("Copiado","ID copiado.");});

    if (isCreator) {
      document.getElementById("saveRulesBtn")?.addEventListener('click', async ()=>{
        const g = id=>parseInt(document.getElementById(id).value);
        const pg=g("editPG"),pe=g("editPE"),px=g("editPX"),ml=g("editML"),mp=g("editMP");
        const p1=g("ep1"),p2=g("ep2"),p3=g("ep3"),p4=g("ep4");
        if ([pg,pe,px,ml,mp].some(isNaN)) { showModal("Error","Los valores deben ser números.",true); return; }
        if (p1+p2+p3+p4!==100) { showModal("Error","Los porcentajes deben sumar 100%.",true); return; }
        const nc = {...currentGroup.config, puntos_ganador:pg, puntos_empate:pe, puntos_marcador_exacto:px, minutos_limite_antes:ml, minutos_poll:mp, porcentajes_premios:{"1":p1,"2":p2,"3":p3,"4":p4}};
        const { error } = await supabase.from('groups').update({ config:nc }).eq('id', currentGroup.id);
        if (error) showModal("Error",error.message,true);
        else { currentGroup.config=nc; showModal("¡Guardado!","Reglas actualizadas."); startGroupPolling(); loadSettingsTab(); loadRanking(); }
      });
      document.getElementById("addFundBtn")?.addEventListener('click', async ()=>{
        const amt = parseFloat(document.getElementById("addAmount").value);
        const dep = document.getElementById("depositorName").value.trim();
        if (isNaN(amt)||amt<=0) { showModal("Error","Monto inválido.",true); return; }
        if (!dep) { showModal("Error","Ingresá el nombre del depositante.",true); return; }
        const { error } = await supabase.from('fund_transactions').insert({ group_id:currentGroup.id, user_id:currentUser.id, amount:amt, description:`Depósito de: ${dep}` });
        if (error) showModal("Error",error.message,true);
        else {
          const nt = (currentGroup.fondo_comun_total||0)+amt;
          await supabase.from('groups').update({ fondo_comun_total:nt }).eq('id', currentGroup.id);
          currentGroup.fondo_comun_total=nt;
          document.getElementById("addAmount").value=''; document.getElementById("depositorName").value='';
          loadSettingsTab(); loadRanking();
          showModal("¡Depósito registrado!",`Bs. ${amt.toFixed(2)} agregados. Depositante: ${dep}`);
        }
      });
    }
    document.getElementById("downloadCsvBtn")?.addEventListener('click', downloadCSV);
  }

  // ===== TABS NAV =====
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el=>el.classList.add('hidden'));
    const tid = `tab${tabId.charAt(0).toUpperCase()+tabId.slice(1)}`;
    document.getElementById(tid)?.classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`.tab[data-tab="${tabId}"]`)?.classList.add('active');
    if (tabId==='ranking') loadRanking();
    if (tabId==='history') loadHistory();
    if (tabId==='chat') loadChatMessages();
    if (tabId==='admin' && currentGroup?.created_by===currentUser?.id) loadAdminTab();
    if (tabId==='settings') loadSettingsTab();
    if (tabId==='allpredictions') loadAllPredictions();
    if (tabId==='bracket') loadBracket();
  }
  document.querySelectorAll('.tab').forEach(tab=>{ tab.onclick=()=>switchTab(tab.getAttribute('data-tab')); });

  // ===== CSV =====
  async function downloadCSV() {
    if (!currentGroup) { showModal("Error","Sin grupo seleccionado.",true); return; }
    const { data: preds } = await supabase.from('predictions').select('*').eq('group_id', currentGroup.id);
    if (!preds?.length) { showModal("Sin datos","No hay pronósticos para exportar.",true); return; }
    const matchIds = [...new Set(preds.map(p=>p.match_id))];
    const { data: matches } = await supabase.from('matches').select('*').in('id', matchIds);
    const mMap = new Map(matches?.map(m=>[m.id,m])||[]);
    const userIds = [...new Set(preds.map(p=>p.user_id))];
    const { data: profiles } = await supabase.from('profiles').select('id,username').in('id', userIds);
    const uMap = new Map(profiles?.map(p=>[p.id,p.username])||[]);
    const BOM='\uFEFF';
    const header='Partido,Fase,Fecha,Resultado,Jugador,Local,Visitante,Comodín,Puntos';
    const rows = preds.map(p=>{
      const m = mMap.get(p.match_id);
      const mn = m?`${m.home_team} vs ${m.away_team}`:'?';
      const date = (m && m.match_datetime) ? fmtDT(toBoliviaDisplay(m.match_datetime)) : 'Fecha no disponible';
      const res = m?.result?`${m.result.home}-${m.result.away}`:'Pendiente';
      const uname = uMap.get(p.user_id)||p.user_id;
      return `"${mn}","${m?.group_name||''}","${date}","${res}","${uname}",${p.predicted_home},${p.predicted_away},${p.joker_used?'Sí':'No'},${p.points_earned??''}`;
    });
    const csv = BOM+header+'\n'+rows.join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.setAttribute('download',`polla_${currentGroup.name.replace(/[^a-z0-9]/gi,'_')}_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showModal("¡Descarga lista!","El archivo CSV se ha descargado.");
  }

  // ===== BOOT =====
  loadUser();
})();
</script>
</body>
</html>
